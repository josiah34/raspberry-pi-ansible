---
- name: Configure SSH security
  hosts: pi5
  become: true

  handlers:
    - name: Reload SSH
      ansible.builtin.service:
        name: ssh
        state: reloaded

  tasks:
    - name: Disable SSH password authentication
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/01-disable-password.conf
        content: |
          PasswordAuthentication no
        owner: root
        group: root
        mode: "0644"
      notify: Reload SSH

    - name: Validate SSH configuration
      ansible.builtin.command: sshd -t 
      changed_when: false
    
    - name: Get SSH effective configuration 
      ansible.builtin.command: sshd -T
      register: ssh_config
      changed_when: false

    - name: Verify password authentication is disabled 
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in ssh_config.stdout_lines"
        fail_msg: "SSH password authentication is not disabled"
        success_msg: "SSH password authentication is disabled"
